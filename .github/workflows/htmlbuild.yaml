name: Run Batch Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    # 1. Setup V-Slice Compatible Haxe Version
    - name: Setup Haxe
      uses: krdlab/setup-haxe@v1
      with:
        haxe-version: 4.3.4

    # 2. Complete Environment Configuration & Error Prevention
    - name: Install V-Slice Dependencies
      shell: cmd
      run: |
        :: Re-register baseline tools
        haxelib install lime
        haxelib run lime setup
        haxelib install openfl
        haxelib install flixel
        
        :: Install Haxe Module Manager globally
        haxelib --global install hmm
        haxelib --global run hmm setup
        
        :: CRITICAL V-SLICE FIX: Remove funkin.vis from hmm configuration to prevent compilation lock
        powershell -Command "(Get-Content hmm.json) -replace '\"funkin.vis\"', '// \"funkin.vis\"' | Set-Content hmm.json"
        
        :: Synchronize and pull precise V-Slice Git libraries 
        hmm install

    # 3. Create the automated target container
    - name: Create output directory
      shell: cmd
      run: |
        if not exist "pre-built builds" mkdir "pre-built builds"

    # 4. Trigger isolated batch compilation
    - name: Run build script
      shell: cmd
      run: |
        call scripts\itch-building\build-Itch-HTML.bat

    # 5. Commit compiled HTML5 assets directly back to the repository
    - name: Commit and push changes
      shell: cmd
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "pre-built builds/*"
        git diff-index --quiet HEAD -- || (git commit -m "Add automated build artifacts" && git push origin main)
