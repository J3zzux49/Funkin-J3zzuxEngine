name: Run Batch Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    # 1. Install Haxe (Required for Lime)
    - name: Setup Haxe
      uses: krdlab/setup-haxe@v1
      with:
        haxe-version: 4.3.4 # Change this to match your local Haxe version if needed

    # 2. Install Lime and setup its dependencies
    - name: Install Lime & Tools
      shell: cmd
      run: |
        haxelib install lime
        haxelib run lime setup
        haxelib install openfl
        haxelib install flixel
        :: Add any other specific haxelibs your game needs here (e.g., haxelib install flixel-addons)

    # 3. Download and Install Itch.io Butler tool
    - name: Setup Butler
      shell: cmd
      run: |
        curl -L -o butler.zip https://itch.ovh
        powershell -Command "Expand-Archive -Path butler.zip -DestinationPath C:\butler"
        echo C:\butler >> %GITHUB_PATH%

    - name: Create output directory
      shell: cmd
      run: |
        if not exist "pre-built builds" mkdir "pre-built builds"

    # 4. Execute the build and capture output before Butler uploads
    - name: Run build script
      shell: cmd
      env:
        BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }} # Required for Butler to push without an interactive login prompt
      run: |
        call scripts\itch-building\build-Itch-HTML.bat

    # 5. Move the HTML5 bin export files to your repository output folder
    - name: Stage Artifacts
      shell: cmd
      run: |
        if exist export\debug\html5\bin xcopy /E /Y export\debug\html5\bin "pre-built builds\"

    - name: Commit and push changes
      shell: cmd
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "pre-built builds/*"
        git diff-index --quiet HEAD -- || (git commit -m "Add automated build artifacts" && git push origin main)
